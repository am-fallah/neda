# Single-replica, non-root Neda deployment.
#
# Secure default:
#   NEDA_PUBLIC_URL=https://neda.example.com
#   NEDA_VAPID_SUBJECT=mailto:owner@example.com
#   NEDA_MRBILIT_ENABLED=true (must be set explicitly; real provider required)
#   NEDA_RUNTIME_UID / NEDA_RUNTIME_GID matching the owner of ./data
#   ./secrets/encryption_key (base64, exactly 32 bytes, mode 0400/0600 on host,
#   owned by NEDA_RUNTIME_UID)
#
# Direct public-IP HTTP mode (unencrypted; use only when the network is trusted
# or an external VPN/TLS tunnel is used):
#   NEDA_PUBLIC_URL=http://SERVER_PUBLIC_IP:PORT
#   NEDA_ALLOW_INSECURE_HTTP=true
#   NEDA_PUBLISH_HOST=0.0.0.0
#   NEDA_PUBLISH_PORT=PORT
#   NEDA_TRUST_PROXY=false
#
# The key is a read-only bind mount, not a Compose secret: file-based Compose
# secrets are bind mounts in non-swarm Compose and their uid/gid/mode fields are
# ignored, so the host file's owner and mode are authoritative. The service
# enforces owner == runtime UID and mode 0400/0600. /data is also a host bind
# mount so SQLite and the key can be backed up together; it must be writable by
# the runtime UID. Run scripts/setup.sh once before the first start.
services:
  neda:
    build:
      context: .
      dockerfile: Dockerfile
    image: neda:local
    # Never pull the mutable tag from Docker Hub before building. Without this,
    # Compose tries the registry first and only falls back to a local build.
    pull_policy: build
    restart: unless-stopped
    user: "${NEDA_RUNTIME_UID:-1000}:${NEDA_RUNTIME_GID:-1000}"
    read_only: true
    init: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "${NEDA_PUBLISH_HOST:-127.0.0.1}:${NEDA_PUBLISH_PORT:-8080}:8080"
    environment:
      NEDA_ENV: production
      NEDA_HTTP_ADDR: ":8080"
      NEDA_DB_PATH: /data/neda.db
      NEDA_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      NEDA_PUBLIC_URL: "${NEDA_PUBLIC_URL:?set NEDA_PUBLIC_URL to the public origin}"
      NEDA_ALLOW_INSECURE_HTTP: "${NEDA_ALLOW_INSECURE_HTTP:-false}"
      NEDA_VAPID_SUBJECT: "${NEDA_VAPID_SUBJECT:?set NEDA_VAPID_SUBJECT to a mailto: or HTTPS contact}"
      NEDA_MRBILIT_ENABLED: "${NEDA_MRBILIT_ENABLED:?set NEDA_MRBILIT_ENABLED=true (real provider required in production)}"
      NEDA_TRUST_PROXY: "${NEDA_TRUST_PROXY:-false}"
      NEDA_LOG_LEVEL: "${NEDA_LOG_LEVEL:-info}"
      NEDA_WORKERS: "${NEDA_WORKERS:-2}"
      NEDA_SESSION_TTL_HOURS: "${NEDA_SESSION_TTL_HOURS:-720}"
      NEDA_SESSION_IDLE_HOURS: "${NEDA_SESSION_IDLE_HOURS:-168}"
    volumes:
      - ./data:/data
      - ./secrets/encryption_key:/run/secrets/encryption_key:ro
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    healthcheck:
      test: ["CMD", "/neda", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
