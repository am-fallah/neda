# Single-replica, non-root Neda deployment.
#
# Required:
#   NEDA_PUBLIC_URL=https://neda.example.com
#   NEDA_VAPID_SUBJECT=mailto:owner@example.com
#   NEDA_RUNTIME_UID / NEDA_RUNTIME_GID matching the owner of ./data
#   ./secrets/encryption_key (base64, exactly 32 bytes, mode 0400/0600 on host)
#
# The long-form secret below mounts the key at /run/secrets/encryption_key with
# the requested uid/gid and mode. /data is a host bind mount so SQLite and the
# key can be backed up together; it must be writable by the runtime UID.
services:
  neda:
    build:
      context: .
      dockerfile: Dockerfile
    image: neda:local
    restart: unless-stopped
    user: "${NEDA_RUNTIME_UID:-1000}:${NEDA_RUNTIME_GID:-1000}"
    read_only: true
    init: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NEDA_ENV: production
      NEDA_HTTP_ADDR: ":8080"
      NEDA_DB_PATH: /data/neda.db
      NEDA_ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
      NEDA_PUBLIC_URL: "${NEDA_PUBLIC_URL:?set NEDA_PUBLIC_URL to the HTTPS origin}"
      NEDA_VAPID_SUBJECT: "${NEDA_VAPID_SUBJECT:?set NEDA_VAPID_SUBJECT to a mailto: or HTTPS contact}"
      NEDA_TRUST_PROXY: "${NEDA_TRUST_PROXY:-false}"
      NEDA_LOG_LEVEL: "${NEDA_LOG_LEVEL:-info}"
      NEDA_WORKERS: "${NEDA_WORKERS:-2}"
      NEDA_SESSION_TTL_HOURS: "${NEDA_SESSION_TTL_HOURS:-720}"
      NEDA_SESSION_IDLE_HOURS: "${NEDA_SESSION_IDLE_HOURS:-168}"
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    secrets:
      - source: encryption_key
        target: encryption_key
        uid: "${NEDA_RUNTIME_UID:-1000}"
        gid: "${NEDA_RUNTIME_GID:-1000}"
        mode: 0400
    healthcheck:
      test: ["CMD", "/neda", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      replicas: 1

secrets:
  encryption_key:
    file: ./secrets/encryption_key
