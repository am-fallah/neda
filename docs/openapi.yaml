openapi: 3.0.3
info:
  title: Neda API
  version: 0.1.0
  license:
    name: Private single-user application
    url: https://github.com/am-fallah/neda
  description: |
    Private, single-user train-availability monitor API.

    All `/api/v1/*` routes except login/session probing require the
    `neda_session` cookie. State-changing private routes also require the
    `neda_csrf` cookie and matching `X-CSRF-Token` header plus a same-origin
    `Origin`/`Referer`. Login is public but requires same-origin Origin/Referer
    and is rate-limited. Every request is subject to Host validation; a
    mismatched Host returns `421 Misdirected Request` with the standard error
    body. Timestamps are RFC3339 UTC; departure dates are `YYYY-MM-DD`.
    Secrets (Telegram token/raw chat ID, ciphertext, Push subscription material,
    session tokens) are never returned.
servers:
  - url: /
tags:
  - name: Health
    description: Public liveness/readiness probes.
  - name: Auth
    description: Session login, probing, logout, and password change.
  - name: Monitors
    description: Private monitor CRUD, pause/resume, and detail diagnostics.
  - name: Providers
    description: Registered provider metadata and global provider health.
  - name: History
    description: Durable availability/health events and notification delivery history.
  - name: Overview
    description: Bounded dashboard aggregate.
  - name: Settings
    description: Non-secret settings and encrypted Telegram configuration/testing.
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: healthz
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "405":
          description: Method not allowed
  /readyz:
    get:
      tags: [Health]
      summary: Database/migration readiness probe
      operationId: readyz
      security: []
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "405":
          description: Method not allowed
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Password login
      description: |
        Public login. Requires same-origin `Origin`/`Referer` and is rate-limited
        per client. Sets HttpOnly `neda_session` and `neda_csrf` cookies and
        returns the CSRF token to send in `X-CSRF-Token` on mutations.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/session:
    get:
      tags: [Auth]
      summary: Probe authentication state
      operationId: getSession
      security: []
      responses:
        "200":
          description: Current authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "405":
          description: Method not allowed
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      operationId: logout
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/password:
    post:
      tags: [Auth]
      summary: Change the owner password
      description: Revokes other sessions on success.
      operationId: changePassword
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/monitors:
    get:
      tags: [Monitors]
      summary: List monitors
      operationId: listMonitors
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Monitor list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [Monitors]
      summary: Create a monitor
      operationId: createMonitor
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorRequest"
      responses:
        "201":
          description: Monitor created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/monitors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Monitors]
      summary: Monitor detail with current observations and recent checks
      operationId: getMonitor
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Monitor detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [Monitors]
      summary: Partially edit a monitor
      operationId: updateMonitor
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorPatchRequest"
      responses:
        "200":
          description: Updated monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [Monitors]
      summary: Delete a monitor and its cascade-owned history
      operationId: deleteMonitor
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Monitor deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/monitors/{id}/pause:
    post:
      tags: [Monitors]
      summary: Pause a monitor (idempotent)
      operationId: pauseMonitor
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Paused monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/monitors/{id}/resume:
    post:
      tags: [Monitors]
      summary: Resume a monitor (idempotent)
      operationId: resumeMonitor
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resumed monitor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/providers:
    get:
      tags: [Providers]
      summary: Registered providers and global health
      operationId: listProviders
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Provider metadata and per-provider health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/providers/{providerId}/search:
    post:
      tags: [Providers]
      summary: Resolve a provider search URL and fetch normalized initial results
      operationId: providerSearch
      security:
        - sessionCookie: []
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderSearchRequest"
      responses:
        "200":
          description: Normalized initial search results; no monitor state is written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderSearchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Invalid URL/date/passengers or unresolved route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Provider returned an unusable response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          description: Provider timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/events:
    get:
      tags: [History]
      summary: List durable events with cursor pagination
      operationId: listEvents
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Kind"
        - $ref: "#/components/parameters/MonitorID"
        - $ref: "#/components/parameters/ProviderID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/events/{id}:
    get:
      tags: [History]
      summary: Event detail with per-channel delivery state
      operationId: getEvent
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/deliveries:
    get:
      tags: [History]
      summary: Delivery history with cursor pagination
      operationId: listDeliveries
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Channel"
        - $ref: "#/components/parameters/DeliveryStatus"
        - $ref: "#/components/parameters/EventID"
        - $ref: "#/components/parameters/Kind"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Delivery page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/overview:
    get:
      tags: [Overview]
      summary: Bounded dashboard aggregate
      operationId: getOverview
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/settings:
    get:
      tags: [Settings]
      summary: Non-secret settings and Telegram status
      operationId: getSettings
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags: [Settings]
      summary: Update poll interval and/or Push-enabled flag
      operationId: updateSettings
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdateRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/settings/telegram:
    put:
      tags: [Settings]
      summary: Save or clear encrypted Telegram credentials
      operationId: updateTelegramSettings
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramConfigRequest"
      responses:
        "200":
          description: Updated non-secret settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/settings/telegram/test:
    post:
      tags: [Settings]
      summary: Validate and send one Telegram test message
      operationId: testTelegram
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Updated settings; inspect telegram.lastTestOk/lastErrorKind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/push/config:
    get:
      tags: [Push]
      summary: Authenticated Web Push configuration and device list
      operationId: getPushConfig
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Push availability, public VAPID key, and active devices. No private key, endpoint, or subscription key material is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/push/subscriptions:
    post:
      tags: [Push]
      summary: Register or refresh a browser Push subscription
      operationId: registerPushSubscription
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionRequest"
      responses:
        "201":
          description: Stored subscription metadata; endpoint and keys are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/push/subscriptions/{id}:
    delete:
      tags: [Push]
      summary: Disable a Push subscription
      operationId: deletePushSubscription
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Subscription disabled (idempotent for an existing row)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/push/test:
    post:
      tags: [Push]
      summary: Send a real test Push to one device or all active devices
      operationId: testPush
      security:
        - sessionCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subscriptionId:
                  type: string
                  description: Optional device ID; omitted means all active devices (bounded).
      responses:
        "200":
          description: Sanitized per-attempt result. Error categories never include endpoint/key material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: neda_session
    csrfCookie:
      type: apiKey
      in: cookie
      name: neda_csrf
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned as `nextCursor` by the previous page.
      schema:
        type: string
    Kind:
      name: kind
      in: query
      schema:
        type: string
        enum: [availability, provider_degraded, provider_recovered]
    MonitorID:
      name: monitorId
      in: query
      schema:
        type: string
    ProviderID:
      name: providerId
      in: query
      schema:
        type: string
    Channel:
      name: channel
      in: query
      schema:
        type: string
        enum: [telegram, push]
    DeliveryStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [pending, sending, sent, retry_scheduled, failed, skipped]
    EventID:
      name: eventId
      in: query
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid input, filter, cursor, or request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing/invalid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: CSRF/origin rejected
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: State conflict (expired resume, missing/unreadable Telegram config, password changed)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many login attempts
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Setup/database/optional subsystem unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
        requestId:
          type: string
    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [authenticated, csrfToken, expiresAt]
      properties:
        authenticated:
          type: boolean
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    SessionResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        csrfToken:
          type: string
        setupRequired:
          type: boolean
        expiresAt:
          type: string
          format: date-time
          nullable: true
    PasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
    ProviderSearchRequest:
      type: object
      required: [url, adults]
      properties:
        url:
          type: string
          description: Public MrBilit train search URL with a Jalali departureDate.
        adults:
          type: integer
          minimum: 1
          maximum: 9
        children:
          type: integer
          minimum: 0
          maximum: 9
        infants:
          type: integer
          minimum: 0
          maximum: 9
    SelectedOption:
      type: object
      required: [journeyKey, offeringKey]
      properties:
        journeyKey:
          type: string
        offeringKey:
          type: string
        journeyNativeId:
          type: string
        offeringNativeId:
          type: string
        trainNumber:
          type: string
        operator:
          type: string
        originName:
          type: string
        destinationName:
          type: string
        departureAt:
          type: string
          format: date-time
          nullable: true
        arrivalAt:
          type: string
          format: date-time
          nullable: true
        wagonId:
          type: string
        wagonName:
          type: string
        className:
          type: string
        compartmentType:
