    ObservabilityRateLimitEvent:
      type: object
      required: [occurredAt, kind, previousLevel, escalationLevel, escalated, maintained, previousAdaptiveMs, adaptiveMs, retryAfterMs, derived]
      properties:
        occurredAt:
          type: string
          format: date-time
        kind:
          type: string
          enum: [rate_limited, cooldown_extended, recovery_progress, recovery_step, recovered]
          description: rate_limited covers every observed logical 429; escalated vs maintained is derived from previousLevel/escalationLevel.
        previousLevel:
          type: integer
        escalationLevel:
          type: integer
        escalated:
          type: boolean
        maintained:
          type: boolean
        previousAdaptiveMs:
          type: integer
          format: int64
        adaptiveMs:
          type: integer
          format: int64
        previousCooldownUntil:
          type: string
          format: date-time
          nullable: true
        cooldownUntil:
          type: string
          format: date-time
          nullable: true
        retryAfterMs:
          type: integer
          format: int64
        derived:
          type: boolean
    ObservabilityCheckActivity:
      type: object
      required: [occurredAt, outcome, durationMs, queueWaitMs, monitorId, monitorLabel, incomplete]
      properties:
        occurredAt:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [success, empty, error, discarded, abandoned]
        providerErrorKind:
          type: string
        durationMs:
          type: integer
          format: int64
