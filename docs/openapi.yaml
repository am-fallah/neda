          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Tehran-local 24-hour report time; default 00:05.
        lastReportDate:
          type: string
          description: Most recent report date (YYYY-MM-DD, Tehran).
        lastStatus:
          type: string
          enum: [pending, sending, sent, failed, skipped, uncertain]
        lastSentAt:
          type: string
          format: date-time
          nullable: true
        lastErrorKind:
          type: string
