      properties:
        pollIntervalSeconds:
          type: integer
          minimum: 60
          maximum: 3600
        pushEnabled:
          type: boolean
        monitoringEnabled:
          type: boolean
          description: Persist the global monitoring switch; changing it wakes the scheduler.
        unavailableNotifyAfterMinutes:
          type: integer
          minimum: 60
          maximum: 1440
          description: Confirmed-unavailable grace period in minutes; changing it does not rewrite existing streaks.
        dailyReportTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Tehran-local report time; changing it affects the next scheduler evaluation without rewriting prior report rows.
