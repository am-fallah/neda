      properties:
        generatedAt:
          type: string
          format: date-time
        monitors:
          type: object
          required: [total, active, paused, expired]
          properties:
            total:
              type: integer
            active:
              type: integer
            paused:
              type: integer
            expired:
              type: integer
        providers:
          type: object
          required: [total, degraded, stale]
          properties:
            total:
              type: integer
            degraded:
              type: integer
            stale:
              type: integer
        deliveries:
          type: object
          required: [total, pending, sending, sent, retryScheduled, failed, skipped]
          properties:
            total:
              type: integer
            pending:
              type: integer
            sending:
              type: integer
            sent:
              type: integer
            retryScheduled:
              type: integer
            failed:
              type: integer
            skipped:
              type: integer
        recentEvents:
          type: array
