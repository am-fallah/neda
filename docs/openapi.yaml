          type: boolean
        activeCooldowns:
          type: integer
        degradedProviders:
          type: integer
        incompleteChecks:
          type: integer
          format: int64
          description: Crash-abandoned attempts with no durable provider-request marker in the last 24h. Never counted as success or ordinary failure.
        rateLimitEventsDropped:
          type: integer
          format: int64
        lastErrorKind:
          type: string
    ObservabilityTrafficSummary:
      type: object
      required: [windowSeconds, providerChecks, successes, failures, discarded, rateLimitedChecks, interrupted, incomplete, p95Method, dispatchAttempts, recorded7d, recordedWindowDays, historyAvailable]
      properties:
        windowSeconds:
          type: integer
          format: int64
        providerChecks:
          type: integer
          format: int64
          description: Completed logical adapter.Check calls, not HTTP requests.
        successes:
          type: integer
          format: int64
        failures:
          type: integer
          format: int64
        discarded:
          type: integer
          format: int64
        rateLimitedChecks:
          type: integer
          format: int64
        interrupted:
          type: integer
          format: int64
        incomplete:
          type: integer
          format: int64
        successRate:
          type: number
          format: double
          nullable: true
          description: successes / (successes + failures). Interrupted and discarded checks are excluded.
        averageDurationMs:
          type: integer
          format: int64
          nullable: true
        p95DurationMs:
          type: integer
          format: int64
          nullable: true
          description: Nearest-rank P95 upper bound from disjoint buckets. Null when empty or when P95 falls in the open overflow bucket (>20000ms).
        p95Method:
          type: string
          enum: [disjoint_histogram_upper_bound]
        dispatchAttempts:
          type: integer
          format: int64
        recorded7d:
          type: integer
          format: int64
        recordedWindowDays:
          type: integer
        historyAvailable:
          type: boolean
    ObservabilityProvider:
      type: object
      required: [id, displayName, testOnly, healthState, healthReasons, flags, activeTargets, consecutiveFailures, openEpisode, adaptive, providerChecks]
      properties:
        id:
          type: string
        displayName:
          type: string
        testOnly:
          type: boolean
        healthState:
          type: string
          enum: [healthy, degraded, rate_limited, cooling_down, recovering, idle, unknown]
        healthReasons:
          type: array
          items:
            type: string
        flags:
          $ref: "#/components/schemas/ObservabilityFlags"
        activeTargets:
          type: integer
        lastProviderCheckAt:
          type: string
          format: date-time
          nullable: true
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
        lastFailureAt:
          type: string
          format: date-time
          nullable: true
        lastErrorKind:
          type: string
        consecutiveFailures:
          type: integer
        openEpisode:
          type: boolean
        adaptive:
          $ref: "#/components/schemas/ObservabilityAdaptive"
        providerChecks:
          $ref: "#/components/schemas/ObservabilityChecks"
        queue:
          allOf:
            - $ref: "#/components/schemas/ObservabilityQueue"
          nullable: true
    ObservabilityFlags:
      type: object
      required: [degraded, stale, rateLimited, coolingDown, recovering, idle, unknown]
      properties:
        degraded:
          type: boolean
        stale:
          type: boolean
          description: Secondary qualifier; may accompany any primary state. Computed with the documented effective-interval/next-due/cooldown formula.
        rateLimited:
          type: boolean
        coolingDown:
          type: boolean
        recovering:
          type: boolean
        idle:
          type: boolean
        unknown:
          type: boolean
    ObservabilityAdaptive:
      type: object
      required: [level, adaptiveIntervalSeconds, effectiveIntervalSeconds, recoverySuccesses, requiredSuccesses, remainingSuccesses, cooldown, historyCompleteness, historyAvailable]
      properties:
        level:
          type: integer
        adaptiveIntervalSeconds:
          type: integer
          format: int64
        effectiveIntervalSeconds:
          type: integer
          format: int64
        recoverySuccesses:
          type: integer
        requiredSuccesses:
          type: integer
        remainingSuccesses:
          type: integer
        cooldown:
          type: object
          required: [status, remainingSeconds]
          properties:
            status:
              type: string
              enum: [none, active, expired]
            until:
              type: string
              format: date-time
              nullable: true
            remainingSeconds:
              type: integer
              format: int64
        last429At:
          type: string
          format: date-time
          nullable: true
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
        historyCompleteness:
          type: string
          enum: [best_effort]
        historyAvailable:
          type: boolean
    ObservabilityChecks:
      type: object
      required: [last1m, last5m, last15m, last1h, last24h, successes24h, failures24h, discarded24h, rateLimitedChecks24h, interrupted24h, incomplete24h, recorded7d, p95Method]
      properties:
        last1m:
          type: integer
          format: int64
        last5m:
          type: integer
          format: int64
        last15m:
          type: integer
          format: int64
        last1h:
          type: integer
          format: int64
        last24h:
          type: integer
          format: int64
        successes24h:
          type: integer
          format: int64
        failures24h:
          type: integer
          format: int64
        discarded24h:
          type: integer
          format: int64
        rateLimitedChecks24h:
          type: integer
          format: int64
        interrupted24h:
          type: integer
          format: int64
        incomplete24h:
          type: integer
          format: int64
        recorded7d:
          type: integer
          format: int64
        successRate:
          type: number
          format: double
          nullable: true
        averageDurationMs:
          type: integer
          format: int64
          nullable: true
        p95DurationMs:
          type: integer
          format: int64
          nullable: true
        p95Method:
          type: string
          enum: [disjoint_histogram_upper_bound]
    ObservabilityQueue:
      type: object
      required: [available, stale, sampleIntervalSeconds, aggregation, due, inFlight, queued, overdue, deferred, deferredByCooldown, deferredBySpacing, deferredByConcurrency, blockedByConcurrency]
      properties:
        available:
          type: boolean
        sampledAt:
          type: string
          format: date-time
          nullable: true
        stale:
          type: boolean
        sampleIntervalSeconds:
          type: integer
          format: int64
        aggregation:
          type: string
          enum: [sampled_point_in_time]
          description: Point-in-time samples. Avg values are arithmetic means over available samples, not time-weighted measurements.
        due:
          type: integer
        inFlight:
          type: integer
        queued:
          type: integer
        overdue:
          type: integer
        deferred:
          type: integer
        deferredByCooldown:
          type: integer
        deferredBySpacing:
          type: integer
        deferredByConcurrency:
          type: integer
        oldestPendingAgeSeconds:
          type: integer
          format: int64
          nullable: true
        nextEligibleAt:
          type: string
          format: date-time
          nullable: true
        blockedByConcurrency:
          type: boolean
    ObservabilityTrafficPoint:
      type: object
      required: [bucketStart, providerChecks, successes, failures, discarded, rateLimitedChecks, interrupted, incomplete]
      properties:
        bucketStart:
          type: string
          format: date-time
        providerChecks:
          type: integer
          format: int64
        successes:
          type: integer
          format: int64
        failures:
          type: integer
          format: int64
        discarded:
          type: integer
          format: int64
        rateLimitedChecks:
          type: integer
          format: int64
        interrupted:
          type: integer
          format: int64
        incomplete:
          type: integer
          format: int64
        averageDurationMs:
          type: integer
          format: int64
          nullable: true
        p95DurationMs:
          type: integer
          format: int64
          nullable: true
    ObservabilityQueuePoint:
      type: object
      required: [bucketStart, dueAvg, dueMax, overdueMax, deferredAvg, deferredMax, inFlightMax, oldestDueAgeMaxMs, dispatchAttempts, deferralEpisodesCooldown, deferralEpisodesSpacing, deferralEpisodesConcurrency]
      properties:
        bucketStart:
          type: string
          format: date-time
        dueAvg:
          type: integer
          format: int64
        dueMax:
          type: integer
          format: int64
        overdueMax:
          type: integer
          format: int64
        deferredAvg:
          type: integer
          format: int64
        deferredMax:
          type: integer
          format: int64
        inFlightMax:
          type: integer
          format: int64
        oldestDueAgeMaxMs:
          type: integer
          format: int64
        dispatchAttempts:
          type: integer
          format: int64
        deferralEpisodesCooldown:
          type: integer
          format: int64
        deferralEpisodesSpacing:
